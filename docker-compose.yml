services:
  api-gateway:
    image: nginx:alpine
    container_name: shop-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - user-service
      - catalog-service
      - cart-service
      - inventory-service
      - order-service

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  redis:
    image: redis:7-alpine
    container_name: shop-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  user-service:
    build:
      context: ./services/user-service
    container_name: shop-user-service
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ./services/user-service/.env
    depends_on:
      - user-db

  user-db:
    image: postgres:16
    container_name: shop-user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  catalog-service:
    build:
      context: ./services/catalog-service
    container_name: shop-catalog-service
    command: python manage.py runserver 0.0.0.0:8001
    ports:
      - "8001:8001"
    env_file:
      - ./services/catalog-service/.env
    depends_on:
      - catalog-db
      - redis
      - rabbitmq

  catalog-db:
    image: postgres:16
    container_name: shop-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data

  catalog-worker:
    build:
      context: ./services/catalog-service
    container_name: shop-catalog-worker
    command: celery -A config worker --loglevel=info
    env_file:
      - ./services/catalog-service/.env
    depends_on:
      - catalog-db
      - redis
      - rabbitmq

  cart-service:
    build:
      context: ./services/cart-service
    container_name: shop-cart-service
    command: python manage.py runserver 0.0.0.0:8002
    ports:
      - "8002:8002"
    env_file:
      - ./services/cart-service/.env
    depends_on:
      - redis
      - catalog-service
      - inventory-service

  inventory-db:
    image: postgres:16
    container_name: shop-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data

  inventory-service:
    build:
      context: ./services/inventory-service
    container_name: shop-inventory-service
    command: python manage.py runserver 0.0.0.0:8003
    ports:
      - "8003:8003"
    env_file:
      - ./services/inventory-service/.env
    depends_on:
      - inventory-db

  inventory-worker:
    build:
      context: ./services/inventory-service
    container_name: shop-inventory-worker
    command: python manage.py consume_catalog_events
    env_file:
      - ./services/inventory-service/.env
    depends_on:
      - inventory-db
      - rabbitmq
    restart: unless-stopped

  order-db:
    image: postgres:16
    container_name: shop-order-db
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

  order-service:
    build:
      context: ./services/order-service
    container_name: shop-order-service
    command: python manage.py runserver 0.0.0.0:8004
    ports:
      - "8004:8004"
    env_file:
      - ./services/order-service/.env
    depends_on:
      - order-db
      - cart-service
      - catalog-service
      - inventory-service

  prometheus:
    image: prom/prometheus:latest
    container_name: shop-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: shop-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  grafana:
    image: grafana/grafana:latest
    container_name: shop-grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  user-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: shop-user-db-exporter
    environment:
      DATA_SOURCE_URI: "user-db:5432/${USER_DB_NAME}"
      DATA_SOURCE_USER: ${USER_DB_USER}
      DATA_SOURCE_PASS: ${USER_DB_PASSWORD}
    ports:
      - "9187:9187"
    depends_on:
      - user-db

  catalog-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: shop-catalog-db-exporter
    environment:
      DATA_SOURCE_URI: "catalog-db:5432/${CATALOG_DB_NAME}"
      DATA_SOURCE_USER: ${CATALOG_DB_USER}
      DATA_SOURCE_PASS: ${CATALOG_DB_PASSWORD}
    ports:
      - "9188:9187"
    depends_on:
      - catalog-db

  inventory-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: shop-inventory-db-exporter
    environment:
      DATA_SOURCE_URI: "inventory-db:5432/${INVENTORY_DB_NAME}"
      DATA_SOURCE_USER: ${INVENTORY_DB_USER}
      DATA_SOURCE_PASS: ${INVENTORY_DB_PASSWORD}
    ports:
      - "9189:9187"
    depends_on:
      - inventory-db

  order-db-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: shop-order-db-exporter
    environment:
      DATA_SOURCE_URI: "order-db:5432/${ORDER_DB_NAME}"
      DATA_SOURCE_USER: ${ORDER_DB_USER}
      DATA_SOURCE_PASS: ${ORDER_DB_PASSWORD}
    ports:
      - "9190:9187"
    depends_on:
      - order-db

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: shop-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    container_name: shop-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: shop-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  user_postgres_data:
  catalog_postgres_data:
  redis_data:
  rabbitmq_data:
  inventory_postgres_data:
  order_postgres_data:
  grafana_data:
  prometheus_data:
  alloy_data:
  loki_data:
