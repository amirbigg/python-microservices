global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Monitor Docker containers
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8000"

  - job_name: "catalog-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8001"

  - job_name: "cart-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8002"

  - job_name: "inventory-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8003"

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8004"
