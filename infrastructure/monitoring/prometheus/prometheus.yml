global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Monitor Docker containers
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "user-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "user-service:8000"

  - job_name: "catalog-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "catalog-service:8001"

  - job_name: "cart-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "cart-service:8002"

  - job_name: "inventory-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "inventory-service:8003"

  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "order-service:8004"

  - job_name: "user-postgres"
    static_configs:
        - targets: ["user-db-exporter:9187"]

  - job_name: "catalog-postgres"
    static_configs:
      - targets: [ "catalog-db-exporter:9187" ]

  - job_name: "inventory-postgres"
    static_configs:
      - targets: [ "inventory-db-exporter:9187" ]

  - job_name: "order-postgres"
    static_configs:
      - targets: [ "order-db-exporter:9187" ]

  - job_name: "redis"
    static_configs:
      - targets:
        - "redis-exporter:9121"

  - job_name: "rabbitmq"
    static_configs:
      - targets:
        - "rabbitmq:15692"
