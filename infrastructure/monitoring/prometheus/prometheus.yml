global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  # Monitor Docker containers
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"